name: Finalize Completed Season

on:
  schedule:
    # Mar 15 at 10AM UTC - after the league renews into the new year and all stat corrections are in
    - cron: '0 10 15 3 *'
  workflow_dispatch:
    inputs:
      season:
        description: 'Completed season to finalize (blank = the season before the current MFL season)'
        required: false
        default: ''

# Needed to push updated CSVs back to the repo
permissions:
  contents: write

concurrency:
  group: finalize-season
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .ENV from secrets
        run: |
          cat > .ENV <<'EOF'
          mfl_api_key='${{ secrets.MFL_API_KEY }}'
          mfl_league_id='${{ secrets.MFL_LEAGUE_ID }}'
          EOF

      - name: Finalize season
        env:
          SEASON: ${{ inputs.season }}
        run: |
          if [ -n "$SEASON" ]; then
            python ingest/finalize_season.py --season "$SEASON"
          else
            python ingest/finalize_season.py
          fi

      - name: Recalculate consistency metrics
        run: python models/consistency.py

      - name: Remove ephemeral .ENV
        if: always()
        run: rm -f .ENV

      - name: Commit and push changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebase on latest to minimize push conflicts
          git pull --rebase || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): finalize completed season on $(date -u +'%Y-%m-%d') (run ${{ github.run_id }})"
            git push
          fi
