name: Weekly Player Scores Ingest

on:
  schedule:
    # Cron format: minute hour day-of-month month day-of-week
    # 0 = Sunday, 1 = Monday, 2 = Tuesday, etc.
    # Monday, Tuesday and Friday at 4AM EST (9AM UTC)
    - cron: '0 9 * * 1,2,5'
    # Thursday at 8AM EST (1PM UTC) - after final scores are posted
    - cron: '0 13 * * 4'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Re-fetch every week of the season (backfills missed runs and late stat corrections)'
        type: boolean
        default: false

# Needed to push updated CSVs back to the repo
permissions:
  contents: write

concurrency:
  group: playerscores-weekly
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure dependency manifest exists
        run: |
          if [ ! -f requirements.txt ]; then
            echo "pandas" > requirements.txt
            echo "requests" >> requirements.txt
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .ENV from secrets/variables
        run: |
          cat > .ENV <<'EOF'
          mfl_api_key='${{ secrets.MFL_API_KEY }}'
          mfl_league_id='${{ secrets.MFL_LEAGUE_ID }}'
          EOF

      - name: Run player scores ingest (previous and current week, or every week on full refresh)
        run: python ingest/playerScores_current.py ${{ inputs.full_refresh && '--all-weeks' || '' }}

      - name: Remove ephemeral .ENV
        run: rm -f .ENV

      - name: Commit and push changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebase on latest to minimize push conflicts
          git pull --rebase || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): update player scores (current season) on $(date -u +'%Y-%m-%d') (run ${{ github.run_id }})"
            git push
          fi
